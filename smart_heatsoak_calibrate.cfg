# ============================================================
# SMART_HEATSOAK_CALIBRATE v1.0 - K2 Plus / K2 Pro
# Heatsoak + kalibratie op een thermisch stabiele machine, plus
# automatische warme-herstart-detectie (korte soak als de
# machine nog warm is).
#
# INSTALLATIE (via Fluidd, geen SSH nodig):
#  1. Fluidd -> Configuratie -> nieuw bestand: smart_heatsoak_calibrate.cfg
#  2. Deze volledige inhoud erin plakken en opslaan
#  3. Open printer.cfg en voeg bovenaan (bij de andere includes) toe:
#       [include smart_heatsoak_calibrate.cfg]
#  4. Opslaan -> Firmware herstart (knop in Fluidd)
#  5. Test in de console:  SMART_HEATSOAK_CALIBRATE BED_TEMP=60 CHAMBER_TEMP=0 EXTRUDER_TEMP=200
#     (let op: dit draait de echte routine incl. 15 min soak -
#      cancel gerust na de eerste minuut, het gaat om de aanroep)
#
# SLICER (CrealityPrint) machine start g-code wordt dan alleen:
#   SMART_HEATSOAK_CALIBRATE EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] CHAMBER_TEMP={chamber_temperature[initial_no_support_extruder]}
#   + daaronder het bestaande multicolor-blok (ongewijzigd!)
#
# TERUGVALPLAN: als een firmware-update deze macro ooit wist, geeft
# SMART_HEATSOAK_CALIBRATE een "Unknown command"-error;
# herhaal dan installatiestap 5-8 uit de README.
#
# Alleen op jouw machine bewezen commando's: M104/M140/M141/M190/
# M191/G28/G1/G4/M117/TEMPERATURE_WAIT/BED_MESH_CALIBRATE_START_PRINT/
# START_PRINT. Geen M73, SET_PIN of Z_TILT_ADJUST.
# ============================================================

[gcode_macro _SMART_HEATSOAK_VARS]
# Alle instelbare waardes op een plek:
variable_soak_koud: 45          # minuten soak bij koude start (ASA/ABS)
variable_soak_warm: 15          # minuten soak bij warme herstart (ASA/ABS)
variable_soak_pla: 15           # minuten stabilisatie (PLA/PETG-pad)
variable_warm_marge: 8          # kamer binnen (doel - marge) graden = warme herstart
variable_assist_bed: 105        # bed-boosttemp tijdens kamer opwarmen
variable_pla_max_kamer: 35      # PLA-pad: eerst koelen tot onder deze kamertemp
variable_standby_nozzle: 140    # nozzle standby tijdens wachten (minimale ooze)
gcode:

[gcode_macro SMART_HEATSOAK_CALIBRATE]
description: Filament-gestuurde start: heatsoak + kalibratie op stabiele machine
gcode:
  {% set V = printer["gcode_macro _SMART_HEATSOAK_VARS"] %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set kamer_nu = printer["temperature_sensor chamber_temp"].temperature %}

  ; ---------- Stap 0: schone start ----------
  M140 S0
  M104 S0
  M104 S{V.standby_nozzle}         ; standby: warmt mee, minimale ooze

  {% if CHAMBER_TEMP > 0 %}
    ; ================= ASA/ABS-pad =================
    ; Warme-herstart-detectie: kamer al (bijna) op doel =
    ; machine heeft zijn warmte gehouden -> korte soak volstaat
    {% if kamer_nu >= (CHAMBER_TEMP - V.warm_marge) %}
      {% set SOAK = V.soak_warm|int %}
      M117 Warme herstart - soak {SOAK} min
    {% else %}
      {% set SOAK = V.soak_koud|int %}
      M117 Koude start - soak {SOAK} min
    {% endif %}

    ; Parallel opwarmen + bed assist
    M141 S{CHAMBER_TEMP}           ; kamer direct aan
    M140 S{V.assist_bed}           ; bed-boost
    G28                            ; homen
    G1 Z5 F600                     ; bed vlak onder de nozzle = convectie
    M117 Kamer opwarmen...
    M191 S{CHAMBER_TEMP}           ; wacht tot kamer op doel
    M117 Bed terug naar profieltemp
    M140 S{BED_TEMP}               ; bed terug naar filamenttemp
    M190 S{BED_TEMP}
    ; Soak in minuutblokjes: cancel pakt binnen 1 min,
    ; schermupdate elke 5 min
    {% for i in range(SOAK) %}
      {% if (SOAK - i) % 5 == 0 %}
        M117 Heatsoak: nog {SOAK - i} min
      {% endif %}
      G4 P60000
    {% endfor %}
    M117 Heatsoak klaar

  {% else %}
    ; ================= PLA/PETG-pad =================
    M141 S0                        ; chamber heater uit
    {% if kamer_nu > V.pla_max_kamer %}
      M117 Kamer laten afkoelen...
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MAXIMUM={V.pla_max_kamer}
    {% endif %}
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}
    {% set SOAK = V.soak_pla|int %}
    {% for i in range(SOAK) %}
      {% if (SOAK - i) % 5 == 0 %}
        M117 Heatsoak: nog {SOAK - i} min
      {% endif %}
      G4 P60000
    {% endfor %}
    M117 Heatsoak klaar
  {% endif %}

  ; ---------- Kalibreren op thermisch stabiele machine ----------
  ; (Creality's macro doet zelf: homen, nozzle clean, verse mesh)
  M117 Kalibreren...
  BED_MESH_CALIBRATE_START_PRINT BED_TEMP={BED_TEMP}

  ; ---------- Normale Creality-startroutine ----------
  START_PRINT EXTRUDER_TEMP={EXTRUDER_TEMP} BED_TEMP={BED_TEMP}
