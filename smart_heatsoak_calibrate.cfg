# ============================================================
# SMART_HEATSOAK_CALIBRATE v1.1 - K2 Plus / K2 Pro
# Heatsoak + kalibratie op een thermisch stabiele machine, plus
# automatische warme-herstart-detectie (korte soak als de
# machine nog warm is).
#
# WIJZIGINGEN v1.7:
#  - FIX valse positief: de boot-zelfcheck van de firmware verwarmt
#    het bed naar ~60, waardoor een net aangezette (koude) machine
#    als warme herstart telde en maar 5 min soakte. De PLA warm-
#    check eist nu bed EN kamer warm (warm_kamer_min); een zelfcheck
#    verwarmt de kamer niet, een echte print wel. ASA-pad had de
#    kamer-eis al en was niet geraakt.
#
# WIJZIGINGEN v1.6:
#  - Soak-stempel toegevoegd: na elke afgeronde heatsoak wordt het
#    moment opgeslagen via system_stats.monotonic (dezelfde klok die
#    Creality zelf in START_TIMER gebruikt) in ~/heatsoak_state.cfg.
#    Een verse stempel (< stempel_venster min) telt als warme
#    herstart, ook als het bed alweer is afgekoeld - vangt prints
#    op die kort na de heatsoak zijn afgebroken. Na een Klipper-
#    herstart is de stempel automatisch ongeldig (klok reset) en
#    geldt alleen de temperatuurcheck. Correctie op v1.1: er IS dus
#    een bruikbare (monotone) klok in deze firmware.
#
# WIJZIGINGEN v1.5 (op basis van gcode_macro.cfg van de printer):
#  - Kamerventilator (fan1) draait vol tijdens de koelfase en wordt
#    daarna teruggegeven aan de firmware. Sneller koelen.
#  - Warme-herstart-verkorting nu ook in het PLA-pad: bed nog >=
#    warm_bed_min -> korte soak (soak_pla_warm) i.p.v. volle 15 min.
#
# WIJZIGINGEN v1.4:
#  - FIX: nozzle-standby (140 C) stond al aan VOORDAT het PLA-pad de
#    kamer ging koelen - een kachel in de kamer die je afkoelt. Nu
#    gaat de standby in het PLA-pad pas na de koelfase aan (ASA-pad
#    direct, daar wordt niet gekoeld). Sneller koelen + zuiverder
#    plateaudetectie. Ook dubbele M104 opgeruimd.
#  - LET OP (niet fixbaar in deze macro): M191 in het ASA-pad heeft
#    net als TEMPERATURE_WAIT geen timeout. Bij een onhaalbaar hoge
#    chamber-temp in een filamentprofiel wacht die eeuwig.
#
# WIJZIGINGEN v1.3:
#  - Koelfase is nu ADAPTIEF: meet per minuut of de kamer nog daalt
#    via een sub-macroloop (sub-macros renderen op uitvoermoment en
#    lezen dus verse sensorwaardes). Zakt de kamer < koel_delta per
#    minuut, dan is het plateau = de omgevingstemperatuur bereikt en
#    gaat hij door. Geen aannames (koel_tau/omgeving) meer nodig.
#
# WIJZIGINGEN v1.2:
#  - Koelfase rekent nu met de afkoelwet van Newton (exponentieel
#    verval, minuut-voor-minuut gesimuleerd) i.p.v. een vast aantal
#    minuten per graad. Instelbaar via koel_tau en omgeving.
#  - Is de aangenomen omgeving warmer dan het doel: koelen wordt
#    overgeslagen met een melding (fysiek onmogelijk).
#
# WIJZIGINGEN v1.1:
#  - FIX: PLA-pad kon eeuwig hangen op "Kamer laten afkoelen" als de
#    omgeving (garage) warmer was dan pla_max_kamer. TEMPERATURE_WAIT
#    heeft geen timeout. Vervangen door een begrensde, berekende
#    koelperiode: 2 min per graad boven doel, max koel_max minuten.
#  - FIX: warme-herstart-detectie werkte nooit. printer.printer.event_time
#    bestaat niet in Klipper (werd stil 0 via |default). Klipper-macro's
#    hebben geen klok, dus het hele tijdstempel-mechanisme is verwijderd.
#    Detectie draait nu puur op temperaturen: een bed dat nog >= 50 C is,
#    IS het bewijs van een recente print.
#  - [save_variables] en de tijdstempel-logica verwijderd.
#    SMART_HEATSOAK_MARK_END blijft bestaan als lege stub zodat een
#    bestaande aanroep in de Machine END g-code geen error geeft;
#    je mag die aanroep ook gewoon weghalen.
#
# INSTALLATIE (via Fluidd, geen SSH nodig):
#  1. Fluidd -> Configuratie -> open smart_heatsoak_calibrate.cfg
#  2. Volledige inhoud vervangen door dit bestand en opslaan
#  3. printer.cfg: [include smart_heatsoak_calibrate.cfg] moet er al staan
#  4. Opslaan -> Firmware herstart (knop in Fluidd)
#  5. Test in de console:
#     SMART_HEATSOAK_CALIBRATE BED_TEMP=60 CHAMBER_TEMP=0 EXTRUDER_TEMP=200
#
# SLICER (CrealityPrint) machine start g-code (ongewijzigd):
#   SMART_HEATSOAK_CALIBRATE EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] CHAMBER_TEMP={chamber_temperature[initial_no_support_extruder]}
# ============================================================

[gcode_macro _SMART_HEATSOAK_VARS]
# Alle instelbare waardes op een plek:
variable_soak_koud: 45          # minuten soak bij koude start (ASA/ABS)
variable_soak_warm: 15          # minuten soak bij warme herstart (ASA/ABS)
variable_soak_pla: 15           # minuten stabilisatie (PLA/PETG-pad, koude machine)
variable_soak_pla_warm: 5       # minuten stabilisatie als machine nog warm is (bed-check)
variable_warm_marge: 8          # kamer binnen (doel - marge) graden = warme herstart
variable_warm_bed_min: 50       # bed nog minimaal zo warm = recente print (dit IS de klok)
variable_warm_kamer_min: 30     # kamer moet OOK minimaal zo warm zijn; onderscheidt een
                                #  echte print (kamer mee opgewarmd) van de boot-zelfcheck
                                #  (die alleen het bed verwarmt, kamer blijft koud)
variable_stempel_venster: 30    # minuten: soak-stempel geldig na afronden heatsoak
                                #  (30 zoals het originele warm_venster; langer maakt
                                #  de stempel te oud om nog als bewijs te tellen)
variable_assist_bed: 105        # bed-boosttemp tijdens kamer opwarmen
variable_pla_max_kamer: 35      # PLA-pad: doeltemp kamer voor koelfase
variable_koel_delta: 0.3        # zakt de kamer minder dan dit per minuut -> plateau
                                #  bereikt = omgevingstemperatuur, koelen stoppen
variable_koel_max: 15           # plafond op de koelfase in minuten (anti-hang)
variable_standby_nozzle: 140    # nozzle standby tijdens wachten (minimale ooze)
gcode:

# ------------------------------------------------------------
# Stub. Deed vroeger een tijdstempel-save, maar Klipper-macro's
# hebben geen klok dus dat mechanisme is verwijderd. Blijft
# bestaan zodat "SMART_HEATSOAK_MARK_END" in de Machine END
# g-code geen Unknown command geeft. Mag je daar ook weghalen.
# ------------------------------------------------------------
[gcode_macro SMART_HEATSOAK_MARK_END]
gcode:
  M117 (mark_end: niet meer nodig sinds v1.1)

# ------------------------------------------------------------
# Geheugen op schijf voor de soak-stempel. Klipper maakt dit
# bestand zelf aan bij de eerste SAVE_VARIABLE.
# ------------------------------------------------------------
[save_variables]
filename: ~/heatsoak_state.cfg

# ------------------------------------------------------------
# Stempelt het moment (monotone klok, seconden sinds Klipper-
# start) waarop een heatsoak succesvol is afgerond. Sub-macro,
# dus gerenderd op uitvoermoment = de klok van NA de soak.
# system_stats.monotonic is dezelfde klok die Creality zelf in
# START_TIMER gebruikt. Niet beschikbaar -> stilletjes overslaan.
# ------------------------------------------------------------
[gcode_macro _HEATSOAK_STAMP]
gcode:
  {% set mono = printer.system_stats.monotonic|default(0)|float %}
  {% if mono > 0 %}
    SAVE_VARIABLE VARIABLE=soak_done_mono VALUE={mono}
  {% endif %}

# ------------------------------------------------------------
# Runtime-geheugen voor de adaptieve koelloop.
# prev = kamertemp bij de vorige stap, done = 1 zodra klaar.
# ------------------------------------------------------------
[gcode_macro _KOEL_STATE]
variable_prev: 9999.0
variable_done: 1
gcode:

# ------------------------------------------------------------
# Een koelstap van (max) 1 minuut. Wordt door de hoofdmacro
# meermaals aangeroepen. Cruciaal: een sub-macro wordt pas
# gerenderd op het moment van uitvoering, dus elke stap leest
# VERSE sensorwaardes - dat kan binnen een enkele macro niet.
# Stopt zichzelf (done=1) zodra:
#  - de kamer op doel is, of
#  - de kamer < koel_delta per minuut zakt: plateau bereikt,
#    dat IS de omgevingstemperatuur, verder koelen is zinloos
# Daarna zijn resterende aanroepen no-ops.
# ------------------------------------------------------------
[gcode_macro _KOEL_STAP]
gcode:
  {% set V = printer["gcode_macro _SMART_HEATSOAK_VARS"] %}
  {% set st = printer["gcode_macro _KOEL_STATE"] %}
  {% set t = printer["temperature_sensor chamber_temp"].temperature %}
  {% if st.done|int == 0 %}
    {% if t <= V.pla_max_kamer %}
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=done VALUE=1
      M117 Kamer op doel: {t|round(1)} C
    {% elif (st.prev|float - t) < V.koel_delta %}
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=done VALUE=1
      M117 Kamer zakt niet meer - omgeving is ~{t|round(1)} C, doorgaan
    {% else %}
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=prev VALUE={t}
      M117 Koelen: {t|round(1)} C
      {% for s in range(60) %}
        G4 P1000
      {% endfor %}
    {% endif %}
  {% endif %}

# ------------------------------------------------------------
# Herbruikbare countdown-functie.
# Aanroep: _HEATSOAK_COUNTDOWN MINUTES=45 [LABEL=Heatsoak]
# Pauzeert per seconde (cancel pakt binnen ~1 sec),
# schermupdate elke 5 minuten.
# LET OP: MINUTES=0 is toegestaan en doet dan niets.
# ------------------------------------------------------------
[gcode_macro _HEATSOAK_COUNTDOWN]
gcode:
  {% set MIN = params.MINUTES|default(15)|int %}
  {% set LABEL = params.LABEL|default("Heatsoak") %}
  {% for m in range(MIN) %}
    {% if (MIN - m) % 5 == 0 %}
      M117 {LABEL}: nog {MIN - m} min
    {% endif %}
    {% for s in range(60) %}
      G4 P1000
    {% endfor %}
  {% endfor %}

[gcode_macro SMART_HEATSOAK_CALIBRATE]
description: Filament-gestuurde start: heatsoak + kalibratie op stabiele machine
gcode:
  {% set V = printer["gcode_macro _SMART_HEATSOAK_VARS"] %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set kamer_nu = printer["temperature_sensor chamber_temp"].temperature %}
  {% set bed_nu = printer.heater_bed.temperature %}
  ; Verse soak-stempel? (monotone klok; na een Klipper-herstart is
  ; mono_nu kleiner dan de stempel -> ongeldig -> temperatuurcheck)
  {% set mono_nu = printer.system_stats.monotonic|default(0)|float %}
  {% set stempel = printer.save_variables.variables.soak_done_mono|default(0)|float %}
  {% set stempel_vers = (mono_nu > 0) and (stempel > 0) and (mono_nu > stempel) and ((mono_nu - stempel) < (V.stempel_venster * 60)) %}

  ; ---------- Schone start ----------
  M140 S0
  M104 S0
  ; NB: nozzle-standby wordt per pad gezet. In het PLA-pad pas NA de
  ; koelfase, anders zit er een 140 C kachel in de kamer die we
  ; proberen af te koelen (vertraagt koelen + vervuilt het plateau).

  {% if CHAMBER_TEMP > 0 %}
    ; ================= ASA/ABS-pad =================
    M104 S{V.standby_nozzle}       ; standby: warmt mee, minimale ooze
    ; Warme-herstart-detectie, puur op temperatuur:
    ;  1) kamer nog (bijna) op doel (live sensor)
    ;  2) bed nog restwarm (live sensor)
    ; Het bed koelt na een print in ruwweg een half uur onder de
    ; 50 C. "Bed nog warm" = "recente print", zonder klok nodig.
    {% if stempel_vers or ((kamer_nu >= (CHAMBER_TEMP - V.warm_marge)) and (bed_nu >= V.warm_bed_min)) %}
      {% set SOAK = V.soak_warm|int %}
      M117 Warme herstart - soak {SOAK} min
    {% else %}
      {% set SOAK = V.soak_koud|int %}
      M117 Koude start - soak {SOAK} min
    {% endif %}

    ; Parallel opwarmen + bed assist
    M141 S{CHAMBER_TEMP}           ; kamer direct aan
    M140 S{V.assist_bed}           ; bed-boost
    G28                            ; homen
    G1 Z5 F600                     ; bed vlak onder de nozzle = convectie
    M117 Kamer opwarmen...
    M191 S{CHAMBER_TEMP}           ; wacht tot kamer op doel
    M117 Bed terug naar profieltemp
    M140 S{BED_TEMP}               ; bed terug naar filamenttemp
    M190 S{BED_TEMP}
    _HEATSOAK_COUNTDOWN MINUTES={SOAK}
    _HEATSOAK_STAMP
    M117 Heatsoak klaar

  {% else %}
    ; ================= PLA/PETG-pad =================
    M141 S0                        ; chamber heater uit
    ; Adaptieve koelfase i.p.v. TEMPERATURE_WAIT (die kan niet
    ; timeouten en hing de printer op warme dagen eindeloos op).
    ; De loop MEET per minuut of de kamer nog daalt. Drie uitgangen:
    ;  1) doel bereikt  2) plateau: kamer zakt < koel_delta/min,
    ;  dus de omgeving is bereikt (de warme-garage-situatie)
    ;  3) plafond van koel_max minuten. Kan dus nooit meer hangen
    ; en heeft geen aannames over de omgevingstemperatuur nodig.
    {% if kamer_nu > V.pla_max_kamer %}
      M117 Kamer koelen (nu {kamer_nu|round(1)} C)
      ; Kamerventilator (fan1) op vol tijdens het koelen. Creality's
      ; M141 S0 laat hem alleen passief meeregelen op doel 35; direct
      ; aansturen koelt sneller en geeft een scherper plateau.
      SET_PIN PIN=fan1 VALUE=255
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=done VALUE=0
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=prev VALUE=9999
      {% for i in range(V.koel_max|int) %}
        _KOEL_STAP
      {% endfor %}
      ; Fan teruggeven aan de firmware-regeling
      SET_PIN PIN=fan1 VALUE=0
      M141 S0
    {% endif %}
    M104 S{V.standby_nozzle}       ; standby pas NA het koelen (zie boven)
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}
    ; Warme herstart ook voor PLA: verse soak-stempel, OF bed nog
    ; restwarm EN kamer ook warm. Die kamer-eis is essentieel: de
    ; boot-zelfcheck van de firmware verwarmt het bed ook (naar ~60)
    ; maar laat de kamer koud - zonder deze check telde een net
    ; aangezette, steenkoude machine als "warme herstart".
    {% if stempel_vers or ((bed_nu >= V.warm_bed_min) and (kamer_nu >= V.warm_kamer_min)) %}
      M117 Machine nog warm - korte soak
      _HEATSOAK_COUNTDOWN MINUTES={V.soak_pla_warm}
    {% else %}
      _HEATSOAK_COUNTDOWN MINUTES={V.soak_pla}
    {% endif %}
    _HEATSOAK_STAMP
    M117 Heatsoak klaar
  {% endif %}

  ; ---------- Kalibreren op thermisch stabiele machine ----------
  ; (Creality's macro doet zelf: homen, nozzle clean, verse mesh)
  M117 Kalibreren...
  BED_MESH_CALIBRATE_START_PRINT BED_TEMP={BED_TEMP}

  ; ---------- Normale Creality-startroutine ----------
  START_PRINT EXTRUDER_TEMP={EXTRUDER_TEMP} BED_TEMP={BED_TEMP}
