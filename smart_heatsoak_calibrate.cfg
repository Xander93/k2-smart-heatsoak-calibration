# ============================================================
# SMART_HEATSOAK_CALIBRATE v2.2 - K2 Plus / K2 Pro
# Heatsoak + kalibratie op een thermisch stabiele machine:
# heat -> soak -> calibrate -> print.
#
# v2.2: stempel staat nu in het GEHEUGEN (gcode-variabele, zoals
#       Creality's eigen START_TIMER) i.p.v. op schijf. De schijf-
#       variant leverde niets op: de stempel is per definitie
#       alleen geldig binnen dezelfde Klipper-sessie (na een
#       herstart reset de klok en verklaren we hem ongeldig), en
#       dat is exact de levensduur van een gcode-variabele.
#       Weg: [save_variables], ~/heatsoak_state.cfg, flash-writes
#       en een botsingsrisico met een bestaande save_variables.
# v2.1: vangnet voor onhaalbare chamber-doelen (1-40) toegevoegd.
# v2.0 was een schone herbouw van de v1.x-reeks. Alles wat erin
# zit, samengevat:
#  - Vangnet: CHAMBER_TEMP tussen 1 en 40 wordt behandeld als 0
#    (koud-pad) met een melding. De firmware-heater start pas
#    boven de 40, dus zo'n doel is fysiek onhaalbaar en M191 zou
#    er eeuwig op wachten (M191 heeft geen timeout).
#  - Adaptieve koelfase (koud-pad): meet per minuut of de kamer
#    nog daalt; stopt bij doel, bij plateau (= omgeving bereikt,
#    warme-garage-situatie) of bij het plafond. Kan nooit hangen.
#    Kamerventilator vol tijdens het koelen. Schakelbaar.
#  - Warme herstart, EEN strikte wet voor alle filamenten:
#    korte soak alleen bij verse soak-stempel EN warme temps.
#    De stempel (monotone klok, geschreven na elke afgeronde
#    soak) bewijst dat er echt gesoakt is - onvervalsbaar door
#    boot-zelfcheck of warme garage. De temps bewijzen dat de
#    machine niet is afgekoeld - drempels komen uit het
#    filamentprofiel (BED_TEMP / CHAMBER_TEMP), geen harde
#    getallen. Elk ontbrekend bewijs = volle soak.
#  - Splitsing chamber-pad / koud-pad puur op de chamber-
#    temperatuur in het filamentprofiel (>0 of 0). Filamentnamen
#    doen er niet toe: ASA/ABS/PA-CF/PC -> chamber-pad,
#    PLA/PETG/TPU -> koud-pad.
#  - Nozzle-standby pas NA de koelfase (geen kachel in de kamer
#    die je probeert af te koelen).
#  - HEATSOAK_STATUS console-commando: toont klok, stempel,
#    temps en welke soak de volgende start krijgt.
#  - Na een Klipper-herstart is de stempel automatisch ongeldig
#    (klok reset) -> altijd volle soak. Bewust.
#  - De stempel leeft in het geheugen; er wordt geen bestand
#    aangemaakt. Gebruik HEATSOAK_STATUS om hem te bekijken.
#
# INSTALLATIE (via Fluidd, geen SSH nodig):
#  1. Fluidd -> Configuratie -> smart_heatsoak_calibrate.cfg
#  2. Volledige inhoud vervangen door dit bestand en opslaan
#  3. printer.cfg: [include smart_heatsoak_calibrate.cfg]
#  4. Opslaan -> Firmware herstart
#  5. Test: SMART_HEATSOAK_CALIBRATE BED_TEMP=50 CHAMBER_TEMP=0 EXTRUDER_TEMP=200
#  6. Status: HEATSOAK_STATUS in de console
#
# SLICER (CrealityPrint) machine start g-code (ongewijzigd):
#   SMART_HEATSOAK_CALIBRATE EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] CHAMBER_TEMP={chamber_temperature[initial_no_support_extruder]}
#
# LET OP (firmware, niet fixbaar hier): M191 heeft geen timeout;
# zet geen onhaalbaar hoge chamber-temps in filamentprofielen.
# Chamber-doelen onder de 41 zetten de heater nooit aan.
# ============================================================

[gcode_macro _SMART_HEATSOAK_VARS]
# Alle instelbare waardes op een plek:
variable_soak_koud: 45          # min soak, chamber-pad, koude start
variable_soak_warm: 15          # min soak, chamber-pad, warme herstart
variable_soak_pla: 15           # min stabilisatie, koud-pad, koude start
variable_soak_pla_warm: 5       # min stabilisatie, koud-pad, warme herstart
variable_warm_marge: 8          # kamer moet binnen zoveel graden van het
                                #  chamber-doel van het profiel zitten
variable_warm_bed_marge: 10     # bed moet binnen zoveel graden van de
                                #  bed-doeltemp van het profiel zitten
                                #  (schaalt mee: PLA 50->40, ABS 100->90)
variable_stempel_venster: 30    # min: soak-stempel geldig na afronden soak
variable_assist_bed: 105        # bed-boosttemp tijdens kamer opwarmen
variable_pla_max_kamer: 35      # koud-pad: doeltemp kamer voor koelfase
variable_pla_koelen: 1          # 1 = koelfase aan (kwaliteit: PLA wordt
                                #  zacht boven ~55 kamertemp), 0 = overslaan
variable_koel_delta: 0.3        # zakt de kamer minder dan dit per minuut ->
                                #  plateau = omgeving bereikt, stoppen
variable_koel_max: 15           # plafond koelfase in minuten (anti-hang)
variable_standby_nozzle: 140    # nozzle standby tijdens wachten (min. ooze)
gcode:

# ------------------------------------------------------------
# Geheugen voor de soak-stempel. Bewust een gcode-variabele en
# geen bestand: de stempel is alleen geldig binnen dezelfde
# Klipper-sessie (na een herstart reset de monotone klok), en dat
# is precies zo lang als een gcode-variabele bestaat. Zelfde
# aanpak als Creality's START_TIMER.
# 0 = geen stempel.
# ------------------------------------------------------------
[gcode_macro _HEATSOAK_STATE]
variable_soak_done_mono: 0.0
gcode:

# ------------------------------------------------------------
# Stub uit v1.0; het tijdstempel-mechanisme via de END g-code is
# vervallen (de stempel wordt nu door de startmacro zelf gezet).
# Blijft bestaan zodat een oude aanroep in de Machine END g-code
# geen Unknown command geeft. Mag daar weggehaald worden.
# ------------------------------------------------------------
[gcode_macro SMART_HEATSOAK_MARK_END]
gcode:
  M117

# ------------------------------------------------------------
# Stempelt het moment (monotone klok, seconden sinds Klipper-
# start) waarop een heatsoak succesvol is afgerond. Sub-macro,
# dus gerenderd op uitvoermoment = de klok van NA de soak.
# system_stats.monotonic is dezelfde klok die Creality zelf in
# START_TIMER gebruikt, en net als zij bewaren we de stand in een
# gcode-variabele. Klok niet beschikbaar -> stilletjes overslaan.
# ------------------------------------------------------------
[gcode_macro _HEATSOAK_STAMP]
gcode:
  {% set mono = printer.system_stats.monotonic|default(0)|float %}
  {% if mono > 0 %}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=soak_done_mono VALUE={mono}
  {% endif %}

# ------------------------------------------------------------
# Runtime-geheugen voor de adaptieve koelloop.
# prev = kamertemp bij de vorige stap, done = 1 zodra klaar.
# ------------------------------------------------------------
[gcode_macro _KOEL_STATE]
variable_prev: 9999.0
variable_done: 1
gcode:

# ------------------------------------------------------------
# Een koelstap van (max) 1 minuut. Wordt door de hoofdmacro
# meermaals aangeroepen. Cruciaal: een sub-macro wordt pas
# gerenderd op het moment van uitvoering, dus elke stap leest
# VERSE sensorwaardes - dat kan binnen een enkele macro niet.
# Stopt zichzelf (done=1) zodra:
#  - de kamer op doel is, of
#  - de kamer < koel_delta per minuut zakt: plateau bereikt,
#    dat IS de omgevingstemperatuur, verder koelen is zinloos
# Daarna zijn resterende aanroepen no-ops.
# ------------------------------------------------------------
[gcode_macro _KOEL_STAP]
gcode:
  {% set V = printer["gcode_macro _SMART_HEATSOAK_VARS"] %}
  {% set st = printer["gcode_macro _KOEL_STATE"] %}
  {% set t = printer["temperature_sensor chamber_temp"].temperature %}
  {% if st.done|int == 0 %}
    {% if t <= V.pla_max_kamer %}
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=done VALUE=1
      M117 Kamer op doel: {t|round(1)} C
    {% elif (st.prev|float - t) < V.koel_delta %}
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=done VALUE=1
      M117 Kamer zakt niet meer - omgeving is ~{t|round(1)} C, doorgaan
    {% else %}
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=prev VALUE={t}
      M117 Koelen: {t|round(1)} C
      {% for s in range(60) %}
        G4 P1000
      {% endfor %}
    {% endif %}
  {% endif %}

# ------------------------------------------------------------
# Herbruikbare countdown-functie.
# Aanroep: _HEATSOAK_COUNTDOWN MINUTES=45 [LABEL=Heatsoak]
# Pauzeert per seconde (cancel pakt binnen ~1 sec),
# schermupdate elke 5 minuten. MINUTES=0 doet niets.
# ------------------------------------------------------------
[gcode_macro _HEATSOAK_COUNTDOWN]
gcode:
  {% set MIN = params.MINUTES|default(15)|int %}
  {% set LABEL = params.LABEL|default("Heatsoak") %}
  {% for m in range(MIN) %}
    {% if (MIN - m) % 5 == 0 %}
      M117 {LABEL}: nog {MIN - m} min
    {% endif %}
    {% for s in range(60) %}
      G4 P1000
    {% endfor %}
  {% endfor %}

# ------------------------------------------------------------
# Kijkgaatje: typ HEATSOAK_STATUS in de console en zie klok,
# stempel, temps en wat de volgende start zou krijgen.
# Verandert niets, leest alleen.
# NB: de bed/kamer-drempels hangen van het PROFIEL van de
# volgende print af (BED_TEMP/CHAMBER_TEMP), die kent dit
# commando niet - vandaar de voorwaardelijke formulering.
# ------------------------------------------------------------
[gcode_macro HEATSOAK_STATUS]
gcode:
  {% set V = printer["gcode_macro _SMART_HEATSOAK_VARS"] %}
  {% set kamer = printer["temperature_sensor chamber_temp"].temperature %}
  {% set bed = printer.heater_bed.temperature %}
  {% set mono = printer.system_stats.monotonic|default(0)|float %}
  {% set st = printer["gcode_macro _HEATSOAK_STATE"].soak_done_mono|default(0)|float %}
  {% set vers = (mono > 0) and (st > 0) and (mono > st) and ((mono - st) < (V.stempel_venster * 60)) %}
  {% if mono <= 0 %}
    {action_respond_info("klok: NIET beschikbaar (monotonic=0) -> stempel kan nooit werken; elke start = volle soak")}
  {% elif st <= 0 %}
    {action_respond_info("klok: %.0f s | stempel: GEEN (nog geen soak afgerond sinds deze versie)" % mono)}
  {% elif mono <= st %}
    {action_respond_info("klok: %.0f s | stempel: %.0f s -> uit de toekomst (herstart geweest), ongeldig" % (mono, st))}
  {% else %}
    {action_respond_info("klok: %.0f s | stempel: %.1f min oud | geldig (<%s min): %s" % (mono, (mono - st) / 60, V.stempel_venster, vers))}
  {% endif %}
  {action_respond_info("bed: %.1f C | kamer: %.1f C" % (bed, kamer))}
  {% if vers %}
    {action_respond_info("stempel GELDIG -> korte soak MITS bed binnen %s C van de bed-doeltemp van het profiel (chamber-filamenten: ook kamer binnen %s C van het chamber-doel)" % (V.warm_bed_marge, V.warm_marge))}
  {% else %}
    {action_respond_info("geen geldige stempel -> volgende start = VOLLE soak")}
  {% endif %}

[gcode_macro SMART_HEATSOAK_CALIBRATE]
description: Filament-gestuurde start: heatsoak + kalibratie op stabiele machine
gcode:
  ; ============================================================
  ; GOED OM TE WETEN (voor als je dit later teruleest):
  ; Klipper rekent deze HELE macro eerst uit en speelt hem DAARNA
  ; pas af. Alle waardes hieronder (BED_TEMP, sensordata, de
  ; stempel-beoordeling) worden dus EEN keer vastgelegd, aan het
  ; begin, en kunnen daarna niet meer "verloren" gaan - verderop
  ; staat er al gewoon "M140 S50" in plaats van een variabele.
  ; De "schone start" (M140 S0 / M104 S0) zet alleen de HEATERS
  ; uit, niet deze waardes. Daarom ook: bed_nu is de restwarmte
  ; van de VORIGE print, gemeten voordat wij iets aanraakten -
  ; precies wat de warme-herstart-check wil weten.
  ; Keerzijde: LIVE bijmeten tijdens de macro kan hierdoor niet;
  ; daarvoor bestaat de _KOEL_STAP sub-macro (die wordt pas bij
  ; uitvoering gerenderd en leest dus wel verse sensordata).
  ; ============================================================
  {% set V = printer["gcode_macro _SMART_HEATSOAK_VARS"] %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  ; Vangnet: chamber-doelen van 1 t/m 40 zijn op deze firmware
  ; onhaalbaar (M141/M191 zetten de heater pas aan boven de 40,
  ; daaronder draait alleen de ventilator) en M191 heeft geen
  ; timeout -> eeuwig wachten. Behandel zulke profielen als 0.
  {% if CHAMBER_TEMP > 0 and CHAMBER_TEMP <= 40 %}
    M117 Chamber {CHAMBER_TEMP|int} onhaalbaar (heater start >40) - koud-pad
    {% set CHAMBER_TEMP = 0 %}
  {% endif %}
  {% set kamer_nu = printer["temperature_sensor chamber_temp"].temperature %}
  {% set bed_nu = printer.heater_bed.temperature %}
  ; Verse soak-stempel? (monotone klok; na een Klipper-herstart is
  ; mono_nu kleiner dan de stempel -> ongeldig -> volle soak)
  {% set mono_nu = printer.system_stats.monotonic|default(0)|float %}
  {% set stempel = printer["gcode_macro _HEATSOAK_STATE"].soak_done_mono|default(0)|float %}
  {% set stempel_vers = (mono_nu > 0) and (stempel > 0) and (mono_nu > stempel) and ((mono_nu - stempel) < (V.stempel_venster * 60)) %}
  ; Bed-drempel uit het PROFIEL, niet hardcoded: bed moet binnen
  ; warm_bed_marge van de bed-doeltemp van dit filament zitten.
  {% set bed_warm = bed_nu >= (BED_TEMP - V.warm_bed_marge) %}

  ; ---------- Schone start ----------
  M140 S0
  M104 S0
  ; NB: nozzle-standby wordt per pad gezet. In het koud-pad pas NA
  ; de koelfase, anders zit er een 140 C kachel in de kamer die we
  ; proberen af te koelen (vertraagt koelen + vervuilt het plateau).

  {% if CHAMBER_TEMP > 0 %}
    ; ===== chamber-pad: elk filament met chamber temp > 0 =====
    ; (ASA, ABS, PA-CF, PC, ... - de naam doet er niet toe, alleen
    ;  de chamber-temperatuur in het filamentprofiel)
    M104 S{V.standby_nozzle}       ; standby: warmt mee, minimale ooze
    ; Warme herstart: stempel EN temperaturen, allebei vereist.
    ; Stempel bewijst dat er echt gesoakt is; kamer bijna op het
    ; chamber-doel en bed bijna op de bed-doeltemp bevestigen dat
    ; de machine niet is afgekoeld. Elk ontbrekend bewijs = volle
    ; soak, geen uitzonderingen.
    {% if stempel_vers and (kamer_nu >= (CHAMBER_TEMP - V.warm_marge)) and bed_warm %}
      {% set SOAK = V.soak_warm|int %}
      M117 Stempel + temps warm - soak {SOAK} min
    {% else %}
      {% set SOAK = V.soak_koud|int %}
      M117 Koude start - soak {SOAK} min
    {% endif %}

    ; Parallel opwarmen + bed assist
    M141 S{CHAMBER_TEMP}           ; kamer direct aan
    M140 S{V.assist_bed}           ; bed-boost
    G28                            ; homen
    G1 Z5 F600                     ; bed vlak onder de nozzle = convectie
    M117 Kamer opwarmen...
    M191 S{CHAMBER_TEMP}           ; wacht tot kamer op doel
    M117 Bed terug naar profieltemp
    M140 S{BED_TEMP}               ; bed terug naar filamenttemp
    M190 S{BED_TEMP}
    _HEATSOAK_COUNTDOWN MINUTES={SOAK}
    _HEATSOAK_STAMP
    M117 Heatsoak klaar

  {% else %}
    ; ===== koud-pad: elk filament met chamber temp = 0 =====
    ; (PLA, PETG, TPU, ... - chamber heater blijft uit; de kamer
    ;  wordt hier nooit VERWARMD, hooguit gekoeld voor kwaliteit)
    M141 S0                        ; chamber heater uit
    ; Adaptieve koelfase i.p.v. TEMPERATURE_WAIT (die kan niet
    ; timeouten en hing de printer op warme dagen eindeloos op).
    ; De loop MEET per minuut of de kamer nog daalt. Drie uitgangen:
    ;  1) doel bereikt  2) plateau: kamer zakt < koel_delta/min,
    ;  dus de omgeving is bereikt (de warme-garage-situatie)
    ;  3) plafond van koel_max minuten. Kan dus nooit meer hangen
    ; en heeft geen aannames over de omgevingstemperatuur nodig.
    {% if V.pla_koelen|int == 1 and kamer_nu > V.pla_max_kamer %}
      M117 Kamer koelen (nu {kamer_nu|round(1)} C)
      ; Kamerventilator (fan1) op vol tijdens het koelen. Creality's
      ; M141 S0 laat hem alleen passief meeregelen op doel 35;
      ; direct aansturen koelt sneller en geeft een scherper plateau.
      SET_PIN PIN=fan1 VALUE=255
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=done VALUE=0
      SET_GCODE_VARIABLE MACRO=_KOEL_STATE VARIABLE=prev VALUE=9999
      {% for i in range(V.koel_max|int) %}
        _KOEL_STAP
      {% endfor %}
      ; Fan teruggeven aan de firmware-regeling
      SET_PIN PIN=fan1 VALUE=0
      M141 S0
    {% endif %}
    M104 S{V.standby_nozzle}       ; standby pas NA het koelen (zie boven)
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}
    ; Warme herstart: stempel EN bed warm, allebei vereist. De
    ; stempel bewijst dat er echt gesoakt is (onvervalsbaar door
    ; boot-zelfcheck of warme garage), het bed - gemeten tegen de
    ; bed-doeltemp van het profiel - bevestigt dat de machine niet
    ; is afgekoeld. Elk ontbrekend bewijs = volle soak.
    {% if stempel_vers and bed_warm %}
      M117 Stempel + bed warm - korte soak
      _HEATSOAK_COUNTDOWN MINUTES={V.soak_pla_warm}
    {% else %}
      _HEATSOAK_COUNTDOWN MINUTES={V.soak_pla}
    {% endif %}
    _HEATSOAK_STAMP
    M117 Heatsoak klaar
  {% endif %}

  ; ---------- Kalibreren op thermisch stabiele machine ----------
  ; (Creality's macro doet zelf: homen, nozzle clean, verse mesh)
  M117 Kalibreren...
  BED_MESH_CALIBRATE_START_PRINT BED_TEMP={BED_TEMP}

  ; ---------- Normale Creality-startroutine ----------
  START_PRINT EXTRUDER_TEMP={EXTRUDER_TEMP} BED_TEMP={BED_TEMP}
